      if (coins[i].gone > 0) continue;
      p = project(coins[i].x, coins[i].y);
      if (p.d < 6 || p.d > 900 || Math.abs(p.sx - BW / 2) > lim + 20) continue;
      p.kind = 1; p.o = coins[i]; list.push(p);
    }
    for (i = 0; i < racers.length; i++) {
      p = project(racers[i].x, racers[i].y);
      if (p.d < 4 || p.d > 1500 || Math.abs(p.sx - BW / 2) > lim + 40) continue;
      p.kind = 2; p.o = racers[i]; list.push(p);
    }
    list.sort(function (a, b) { return b.d - a.d; });
    for (i = 0; i < list.length; i++) {
      p = list[i];
      if (p.kind === 0) {
        var tw = 46 * p.o.s * p.s, thh = tw * 1.5;
        g.drawImage(treeImgs[p.o.v], p.sx - tw / 2, p.gy - thh * 0.95, tw, thh);
      } else if (p.kind === 1) {
        var cs = 13 * p.s, spin = Math.abs(Math.cos(clock * 4 + p.o.x * 0.05)) * 0.85 + 0.15;
        g.drawImage(coinImg, p.sx - cs * spin / 2, p.gy - cs * 1.6 - Math.sin(clock * 3 + p.o.y) * cs * 0.15, cs * spin, cs);
      } else drawKart(p, p.o);
    }
  }
  function drawKart(p, r) {
    var g = sctx, w = KW * p.s, h = w * 0.75, isP = r === player;
    var yaw = wrap(r.a - cam.a), tilt = clamp(yaw * 0.6, -0.25, 0.25);
    var bob = (r.v > 5 ? Math.sin(clock * 38 + r.x) * w * 0.012 : 0);
    var hop = isP ? Math.sin(player.hop * Math.PI) * h * 0.35 : 0;
    if (isP) { tilt += player.steer * 0.06 + (player.drift ? player.driftDir * 0.12 : 0); }
    g.save();
    g.translate(p.sx, p.gy + bob - hop);
    g.rotate(tilt);
    if (isP && player.boost > 0) {
      for (var f = 0; f < 2; f++) {
        var fx2 = (f ? 0.12 : -0.12) * w, fl = h * (0.35 + Math.random() * 0.3);
        g.fillStyle = '#ff8a1c'; g.beginPath(); g.moveTo(fx2 - w * 0.06, -h * 0.25); g.lineTo(fx2, -h * 0.25 + fl); g.lineTo(fx2 + w * 0.06, -h * 0.25); g.fill();
        g.fillStyle = '#ffe14a'; g.beginPath(); g.moveTo(fx2 - w * 0.03, -h * 0.25); g.lineTo(fx2, -h * 0.25 + fl * 0.6); g.lineTo(fx2 + w * 0.03, -h * 0.25); g.fill();
      }
    }
    g.drawImage(r.img, -w / 2, -h * 0.955, w, h);
    if (isP && (player.drift || player.offroad) && player.v > 40) {
      var sparkCol = player.offroad ? 'rgba(150,110,60,.7)' : (player.charge > 1.7 ? '#ff8a1c' : player.charge > 0.75 ? '#4cc9f0' : '#ffffff');
      g.fillStyle = sparkCol;
      for (var k = 0; k < 10; k++) {
        var side = k % 2 ? 1 : -1, sx = side * w * (0.38 + Math.random() * 0.1), sz = w * (player.offroad ? 0.08 : 0.035) * (0.5 + Math.random());
        g.fillRect(sx - sz / 2 - side * Math.random() * w * 0.15, -Math.random() * h * 0.35, sz, sz);
      }
    }
    g.restore();
  }

  function ord(n) { return n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'; }
  function fmt(t) { var m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); }
  function placeOf(r) {
    var sorted = racers.slice().sort(function (a, b) {
      var ka = a.finished ? 1e9 - a.order * 1e5 : a.prog, kb = b.finished ? 1e9 - b.order * 1e5 : b.prog;
      return kb - ka;
    });
    return sorted.indexOf(r) + 1;
  }

  function drawHud() {
    var k = clamp(Math.min(W, H) / 640, 0.72, 1.2), place = placeOf(player);
    // speed lines while boosting
    if (player.boost > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3 * k;
      for (var s = 0; s < 14; s++) {
        var a = Math.random() * Math.PI * 2, r0 = Math.max(W, H) * (0.42 + Math.random() * 0.15), len = 60 * k + Math.random() * 80 * k;
        var cx = W / 2, cy = H * 0.45;
        ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.lineTo(cx + Math.cos(a) * (r0 + len), cy + Math.sin(a) * (r0 + len)); ctx.stroke();
      }
    }
    // race panel
    var pw = 210 * k, ph = 120 * k, x0 = 10, y0 = 10;
    ctx.fillStyle = 'rgba(255,250,240,.93)'; rr(ctx, x0, y0, pw, ph, 22 * k); ctx.fill();
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = place === 1 ? '#e8a400' : '#2b2350';
    ctx.font = '800 ' + Math.round(64 * k) + 'px ' + FONT;
    ctx.fillText(String(place), x0 + 14 * k, y0 + 68 * k);
    var nw = ctx.measureText(String(place)).width;
    ctx.font = '800 ' + Math.round(26 * k) + 'px ' + FONT; ctx.fillText(ord(place), x0 + 16 * k + nw, y0 + 40 * k);
    ctx.fillStyle = '#2b2350'; ctx.textAlign = 'right';
    var lapNow = clamp(Math.floor(player.prog / N) + 1, 1, 3);
    ctx.font = '800 ' + Math.round(22 * k) + 'px ' + FONT; ctx.fillText('LAP ' + lapNow + '/3', x0 + pw - 14 * k, y0 + 34 * k);
    ctx.font = '700 ' + Math.round(20 * k) + 'px ' + FONT; ctx.fillText(fmt(player.finished ? player.finishTime : raceTime), x0 + pw - 14 * k, y0 + 62 * k);
    // coins
    ctx.drawImage(coinImg, x0 + 14 * k, y0 + 80 * k, 28 * k, 28 * k);
    ctx.textAlign = 'left'; ctx.font = '800 ' + Math.round(24 * k) + 'px ' + FONT;
    ctx.fillText('× ' + player.coins, x0 + 48 * k, y0 + 103 * k);
    if (best !== null) { ctx.textAlign = 'right'; ctx.font = '600 ' + Math.round(15 * k) + 'px ' + FONT; ctx.fillText('Best ' + fmt(best), x0 + pw - 14 * k, y0 + 103 * k); }

    // map
    var mw = 140 * k, mh = 104 * k, mx = W - mw - 10, my = 66;
    ctx.fillStyle = 'rgba(43,35,80,.55)'; rr(ctx, mx, my, mw, mh, 14 * k); ctx.fill();
    var pad = 10 * k, sc = Math.min((mw - pad * 2) / TEXW, (mh - pad * 2) / TEXH);
    var ox = mx + (mw - TEXW * sc) / 2, oy = my + (mh - TEXH * sc) / 2;
    ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 4 * k; ctx.lineJoin = 'round';
    ctx.beginPath(); for (var i = 0; i < N; i += 3) ctx.lineTo(ox + track[i].x * sc, oy + track[i].y * sc); ctx.closePath(); ctx.stroke();
    racers.forEach(function (r) {
      if (r === player) return;
      ctx.fillStyle = r.color; ctx.beginPath(); ctx.arc(ox + r.x * sc, oy + r.y * sc, 4 * k, 0, 7); ctx.fill();
    });
    ctx.fillStyle = player.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(ox + player.x * sc, oy + player.y * sc, 6 * k, 0, 7); ctx.fill(); ctx.stroke();

    // start lights
    if (state === 'count' || (state === 'race' && raceTime < 1)) {
      var lit = state === 'race' ? 4 : 4 - Math.ceil(countdown), lr = 24 * k, lx = W / 2 - lr * 3.2, ly = H * 0.2;
      ctx.fillStyle = '#2b2350'; rr(ctx, lx - lr * 1.6, ly - lr * 1.6, lr * 9.6, lr * 3.2, lr * 1.2); ctx.fill();
      for (var j = 0; j < 3; j++) { ctx.fillStyle = lit === 4 ? '#3ddc6e' : (j < lit ? '#ff3b30' : '#55507a'); ctx.beginPath(); ctx.arc(lx + j * lr * 3.2, ly, lr, 0, 7); ctx.fill(); }
    }
    // toast
    if (toast.t > 0) {
      ctx.globalAlpha = Math.min(1, toast.t * 3);
      var fs = Math.round(52 * k);
      ctx.font = '800 ' + fs + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 9 * k; ctx.strokeStyle = '#fffaf0'; ctx.lineJoin = 'round';
      ctx.strokeText(toast.text, W / 2, H * 0.33); ctx.fillStyle = toast.col; ctx.fillText(toast.text, W / 2, H * 0.33);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    drawScene();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if (state !== 'menu') drawHud();
  }

  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ================= menus =================
  var startEl = document.getElementById('start'), finishEl = document.getElementById('finish');
  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !ac) ac = new AC();
      if (ac && ac.state === 'suspended') ac.resume();
      startLoops();
    } catch (err) { ac = null; eng = null; }
  }
  function beginRace() {
    setupRace();
    startEl.hidden = true; finishEl.hidden = true;
    document.body.classList.remove('menu');
    state = 'count'; countdown = 3; lastBeep = 4;
  }
  function showFinish() {
    var pl = player.order;
    document.getElementById('place').innerHTML = pl + '<sup>' + ord(pl) + '</sup>';
    var lines = 'Time ' + fmt(player.finishTime) + (player.newBest ? ' (new best!)' : '') + '<br>';
    lines += lapTimes.map(function (t, i) { return 'Lap ' + (i + 1) + ': ' + fmt(t); }).join('<br>');
    lines += '<br>Coins: ' + player.coins;
    document.getElementById('times').innerHTML = lines;
    finishEl.hidden = false;
  }
  document.getElementById('go').addEventListener('click', function () { initAudio(); beginRace(); });
  document.getElementById('again').addEventListener('click', function () { initAudio(); beginRace(); });
  document.getElementById('menuBtn').addEventListener('click', function () {
    finishEl.hidden = true; startEl.hidden = false; state = 'menu'; document.body.classList.add('menu'); setupRace();
  });
  document.getElementById('reset').addEventListener('click', function () {
    if (state !== 'race') return;
    var i = nearestFull(player.x, player.y).i;
    var di = i - player.idx; if (di > N / 2) di -= N; else if (di < -N / 2) di += N;
    player.prog += di; player.idx = i;
    player.x = track[i].x; player.y = track[i].y; player.a = ang[i]; player.v = 0; cam.a = player.a;
  });
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () { muted = !muted; muteBtn.setAttribute('aria-pressed', String(muted)); });
  Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      playerColor = b.getAttribute('data-c'); setupRace();
    });
  });

  buildTrack();
  buildTexture();
  layout();
  setupRace();
  update(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
