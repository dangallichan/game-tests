  }
  function trackPath() {
    ctx.beginPath(); ctx.moveTo(track[0].x, track[0].y);
    for (var i = 1; i < track.length; i++) ctx.lineTo(track[i].x, track[i].y);
    ctx.closePath();
  }

  function drawScenery(o) {
    var s = o.s, x = o.x, y = o.y, night = o.theme === 'night', snow = o.theme === 'snow';
    ctx.fillStyle = 'rgba(0,0,0,.13)';
    ctx.beginPath(); ctx.ellipse(x, y + s * 0.05, s * 0.42, s * 0.13, 0, 0, 7); ctx.fill();
    if (o.kind === 'tree') {
      ctx.fillStyle = '#8a5a35'; rr(x - s * 0.08, y - s * 0.45, s * 0.16, s * 0.5, 3); ctx.fill();
      ctx.fillStyle = night ? '#1f6b4a' : '#3da35d';
      ctx.beginPath(); ctx.arc(x, y - s * 0.72, s * 0.42, 0, 7); ctx.fill();
      ctx.fillStyle = night ? '#2a8059' : '#56bf73';
      ctx.beginPath(); ctx.arc(x - s * 0.12, y - s * 0.82, s * 0.2, 0, 7); ctx.fill();
    } else if (o.kind === 'pine') {
      ctx.fillStyle = '#8a5a35'; rr(x - s * 0.07, y - s * 0.25, s * 0.14, s * 0.3, 3); ctx.fill();
      for (var i = 0; i < 3; i++) {
        var by = y - s * (0.2 + i * 0.28), hw = s * (0.42 - i * 0.09);
        ctx.fillStyle = night ? '#1b5c46' : '#2d8659';
        ctx.beginPath(); ctx.moveTo(x - hw, by); ctx.lineTo(x + hw, by); ctx.lineTo(x, by - s * 0.45); ctx.closePath(); ctx.fill();
        if (snow) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - hw * 0.4, by - s * 0.27); ctx.lineTo(x + hw * 0.4, by - s * 0.27); ctx.lineTo(x, by - s * 0.45); ctx.closePath(); ctx.fill(); }
      }
    } else if (o.kind === 'house') {
      ctx.fillStyle = snow ? '#f7b267' : '#fff1d6'; rr(x - s * 0.36, y - s * 0.55, s * 0.72, s * 0.58, 4); ctx.fill();
      ctx.fillStyle = snow ? '#ffffff' : '#e8453c';
      ctx.beginPath(); ctx.moveTo(x - s * 0.46, y - s * 0.52); ctx.lineTo(x + s * 0.46, y - s * 0.52); ctx.lineTo(x, y - s * 0.98); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8a5a35'; rr(x - s * 0.08, y - s * 0.28, s * 0.16, s * 0.3, 2); ctx.fill();
      ctx.fillStyle = night ? '#ffe066' : '#8fd3ff';
      rr(x - s * 0.28, y - s * 0.42, s * 0.15, s * 0.15, 2); ctx.fill();
      rr(x + s * 0.13, y - s * 0.42, s * 0.15, s * 0.15, 2); ctx.fill();
    } else if (o.kind === 'flower') {
      ctx.setLineDash([]); ctx.strokeStyle = '#3da35d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - s * 0.3); ctx.stroke();
      ctx.fillStyle = o.hue;
      for (var j = 0; j < 5; j++) { var a = j * 1.256; ctx.beginPath(); ctx.arc(x + Math.cos(a) * s * 0.11, y - s * 0.36 + Math.sin(a) * s * 0.11, s * 0.09, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.arc(x, y - s * 0.36, s * 0.07, 0, 7); ctx.fill();
    } else if (o.kind === 'cactus') {
      ctx.fillStyle = '#3a9a5c';
      rr(x - s * 0.12, y - s * 0.8, s * 0.24, s * 0.82, s * 0.12); ctx.fill();
      rr(x - s * 0.36, y - s * 0.55, s * 0.14, s * 0.3, s * 0.07); ctx.fill(); rr(x - s * 0.36, y - s * 0.36, s * 0.3, s * 0.12, s * 0.06); ctx.fill();
      rr(x + s * 0.22, y - s * 0.68, s * 0.14, s * 0.3, s * 0.07); ctx.fill(); rr(x + s * 0.08, y - s * 0.5, s * 0.28, s * 0.12, s * 0.06); ctx.fill();
    } else if (o.kind === 'rock') {
      ctx.fillStyle = '#b08968'; ctx.beginPath(); ctx.ellipse(x, y - s * 0.14, s * 0.32, s * 0.2, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#c9a383'; ctx.beginPath(); ctx.ellipse(x - s * 0.08, y - s * 0.2, s * 0.14, s * 0.08, 0, 0, 7); ctx.fill();
    } else if (o.kind === 'snowman') {
      ctx.setLineDash([]); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#c7d9e6'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y - s * 0.24, s * 0.26, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y - s * 0.62, s * 0.18, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2b2350';
      ctx.beginPath(); ctx.arc(x - s * 0.06, y - s * 0.66, s * 0.025, 0, 7); ctx.arc(x + s * 0.06, y - s * 0.66, s * 0.025, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(x, y - s * 0.62); ctx.lineTo(x + s * 0.14, y - s * 0.59); ctx.lineTo(x, y - s * 0.56); ctx.closePath(); ctx.fill();
    }
  }

  function drawCar() {
    var w = car.w, h = car.h, night = THEMES[themeIdx].name === 'night';
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.a + Math.PI / 2 + Math.sin(car.wobble * 28) * car.wobble * 0.3);
    var sc = 1 + Math.sin(car.bounce * Math.PI) * 0.25;
    ctx.scale(sc, sc);
    if (night) {
      var g = ctx.createLinearGradient(0, -h / 2, 0, -h * 2.1);
      g.addColorStop(0, 'rgba(255,236,150,.55)'); g.addColorStop(1, 'rgba(255,236,150,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-w * 0.4, -h * 0.46); ctx.lineTo(w * 0.4, -h * 0.46); ctx.lineTo(w * 1.1, -h * 2.1); ctx.lineTo(-w * 1.1, -h * 2.1); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(0,0,0,.22)'; rr(-w / 2 + 2, -h / 2 + 4, w, h, w * 0.3); ctx.fill();
    ctx.fillStyle = '#2b2350';
    [[-1, -0.3], [1, -0.3], [-1, 0.28], [1, 0.28]].forEach(function (p) { rr(p[0] * w * 0.5 - w * 0.09, p[1] * h - h * 0.1, w * 0.18, h * 0.2, w * 0.06); ctx.fill(); });
    ctx.fillStyle = car.color; rr(-w / 2, -h / 2, w, h, w * 0.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(-w * 0.12, -h / 2, w * 0.24, h, 1); ctx.fill();
    ctx.fillStyle = '#bfe6ff'; rr(-w * 0.36, -h * 0.26, w * 0.72, h * 0.2, w * 0.1); ctx.fill();
    ctx.fillStyle = '#9fd0ee'; rr(-w * 0.32, h * 0.2, w * 0.64, h * 0.12, w * 0.08); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.14)'; rr(-w * 0.36, -h * 0.04, w * 0.72, h * 0.22, w * 0.08); ctx.fill();
    ctx.fillStyle = '#fff3a8';
    ctx.beginPath(); ctx.arc(-w * 0.28, -h * 0.43, w * 0.09, 0, 7); ctx.arc(w * 0.28, -h * 0.43, w * 0.09, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawHud() {
    var k = K, bw = 190 * k, bh = 96 * k, x = hud.x - bw / 2, y = hud.y - bh / 2;
    ctx.fillStyle = 'rgba(255,250,240,.94)'; rr(x, y, bw, bh, 26 * k); ctx.fill();
    drawStar(x + 40 * k, y + 36 * k, 22 * k * (1 + hudPop * 0.25), 0, '#ffc93c', '#e8a400');
    ctx.fillStyle = '#2b2350'; ctx.font = '800 ' + Math.round(40 * k) + 'px "Baloo 2", "Arial Rounded MT Bold", sans-serif';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillText(String(count), x + 72 * k, y + 39 * k);
    for (var i = 0; i < NSTARS; i++) {
      ctx.fillStyle = i < lapGot ? '#ffc93c' : 'rgba(43,35,80,.16)';
      ctx.beginPath(); ctx.arc(x + 20 * k + i * 13.6 * k, y + 76 * k, 5 * k, 0, 7); ctx.fill();
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var th = THEMES[themeIdx], i;
    ctx.fillStyle = mix(grassFrom.grass, th.grass, grassMix); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = mix(grassFrom.stripe, th.stripe, grassMix);
    var band = Math.max(W, H) / 10;
    for (i = 0; i < 10; i += 2) { if (W >= H) ctx.fillRect(i * band, 0, band, H); else ctx.fillRect(0, i * band, W, band); }

    // pond
    ctx.fillStyle = 'rgba(0,0,0,.1)'; ctx.beginPath(); ctx.ellipse(pond.x, pond.y + 3, pond.r * 1.3, pond.r * 0.95, 0, 0, 7); ctx.fill();
    ctx.fillStyle = th.name === 'snow' ? '#cfeaf7' : '#6ec5f5'; ctx.beginPath(); ctx.ellipse(pond.x, pond.y, pond.r * 1.25, pond.r * 0.9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(pond.x - pond.r * 0.4, pond.y - pond.r * 0.3, pond.r * 0.4, pond.r * 0.16, -0.3, 0, 7); ctx.fill();

    // track: kerb, tarmac, centre line
    ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
    trackPath(); ctx.setLineDash([]); ctx.strokeStyle = '#f4f1e8'; ctx.lineWidth = tw + 12 * K; ctx.stroke();
    trackPath(); ctx.setLineDash([16 * K, 16 * K]); ctx.strokeStyle = '#e8453c'; ctx.lineWidth = tw + 12 * K; ctx.stroke();
    trackPath(); ctx.setLineDash([]); ctx.strokeStyle = '#5c5f73'; ctx.lineWidth = tw; ctx.stroke();
    trackPath(); ctx.setLineDash([14 * K, 14 * K]); ctx.strokeStyle = 'rgba(255,246,214,.75)'; ctx.lineWidth = 4 * K; ctx.stroke();
    ctx.setLineDash([]);

    // chequered start line
    var a0 = Math.atan2(track[1].y - track[0].y, track[1].x - track[0].x), n = 6, sq = tw / n;
    ctx.save(); ctx.translate(track[0].x, track[0].y); ctx.rotate(a0);
    for (i = 0; i < n; i++) for (var r = 0; r < 2; r++) {
      ctx.fillStyle = (i + r) % 2 ? '#2b2350' : '#ffffff';
      ctx.fillRect(car.h * 0.7 + r * sq, -tw / 2 + i * sq, sq + 0.5, sq + 0.5);
    }
    ctx.restore();

    for (i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (s.hit) continue;
      var pulse = 1 + Math.sin(s.spin * 2.5) * 0.1, R = tw * 0.2;
      ctx.fillStyle = 'rgba(255,220,90,.3)'; ctx.beginPath(); ctx.arc(s.x, s.y, R * 1.5 * pulse, 0, 7); ctx.fill();
      drawStar(s.x, s.y, R * pulse, Math.sin(s.spin) * 0.3, '#ffc93c', '#e8a400');
    }
    for (i = 0; i < scenery.length; i++) drawScenery(scenery[i]);
    if (playing) drawHud();

    // "touch here" ring until the first touch
    if (playing && !everTouched) {
      var h = track[16], q = (clock * 1.2) % 1;
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - q) + ')'; ctx.lineWidth = 5 * K;
      ctx.beginPath(); ctx.arc(h.x, h.y, tw * (0.15 + q * 0.4), 0, 7); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(h.x, h.y, tw * 0.13, 0, 7); ctx.fill();
    }
    drawCar();

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life * 1.6, 0, 1); ctx.fillStyle = p.color;
      if (p.confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    if (celebrate > 0) {
      var t = 2.4 - celebrate, sIn = Math.min(1, t * 4), sOut = Math.min(1, celebrate * 3);
      var RR = Math.min(W, H) * 0.2 * sIn * sOut * (1 + Math.sin(t * 9) * 0.05);
      drawStar(W / 2, H * 0.45, RR, Math.sin(t * 3) * 0.2, '#ffc93c', '#ffffff');
      ctx.fillStyle = '#2b2350'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 ' + Math.round(RR * 0.62) + 'px "Baloo 2", "Arial Rounded MT Bold", sans-serif';
      if (RR > 10) ctx.fillText(String(laps), W / 2, H * 0.45 + RR * 0.08);
    }
  }

  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function press(e) { touch.on = true; touch.x = e.clientX; touch.y = e.clientY; if (playing) everTouched = true; e.preventDefault(); }
  function release() { touch.on = false; }
  canvas.addEventListener('pointerdown', function (e) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} press(e); });
  canvas.addEventListener('pointermove', function (e) { if (touch.on) press(e); });
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (playing && e.key.indexOf('Arrow') === 0) everTouched = true;
    if (e.key === ' ' && playing) { doHonk(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  window.addEventListener('resize', build);

  document.getElementById('horn').addEventListener('click', doHonk);
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () { muted = !muted; muteBtn.setAttribute('aria-pressed', String(muted)); });
  Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      car.color = b.getAttribute('data-c'); car.bounce = 1;
    });
  });
  document.getElementById('go').addEventListener('click', function () {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !ac) ac = new AC();
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (err) { ac = null; }
    startEl.hidden = true; playing = true; car.bounce = 1;
    startEngine(); honk();
  });

  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
