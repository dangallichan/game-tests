    ctx.fillStyle = 'rgba(255,255,255,.25)'; rr(-w * 0.12, -h / 2, w * 0.24, h, 1); ctx.fill();
    ctx.fillStyle = '#bfe6ff'; rr(-w * 0.36, -h * 0.26, w * 0.72, h * 0.2, w * 0.1); ctx.fill();
    ctx.fillStyle = '#9fd0ee'; rr(-w * 0.32, h * 0.2, w * 0.64, h * 0.12, w * 0.08); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.14)'; rr(-w * 0.36, -h * 0.04, w * 0.72, h * 0.22, w * 0.08); ctx.fill();
    ctx.fillStyle = '#fff3a8';
    ctx.beginPath(); ctx.arc(-w * 0.28, -h * 0.43, w * 0.09, 0, 7); ctx.arc(w * 0.28, -h * 0.43, w * 0.09, 0, 7); ctx.fill();
    ctx.fillStyle = braking > 0.2 ? '#ff2a2a' : '#a83232';
    rr(-w * 0.4, h * 0.42, w * 0.24, h * 0.05, 2); ctx.fill(); rr(w * 0.16, h * 0.42, w * 0.24, h * 0.05, 2); ctx.fill();
    ctx.restore();
  }

  function drawWorld() {
    var speedFrac = clamp(Math.abs(car.vf) / 690, 0, 1), zoom = zoomBase * (1 - 0.16 * speedFrac);
    var cx = W / 2, cy = H * 0.6, R = Math.hypot(W, H) / zoom, i;
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(-(camA + Math.PI / 2)); ctx.scale(zoom, zoom); ctx.translate(-car.x, -car.y);

    for (i = 0; i < patches.length; i++) {
      var p = patches[i];
      if (Math.abs(p.x - car.x) > R || Math.abs(p.y - car.y) > R) continue;
      ctx.fillStyle = p.dark ? '#6fbc5f' : '#8ad479';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, p.a, 0, 7); ctx.fill();
    }

    ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
    ctx.setLineDash([]); ctx.strokeStyle = '#f4f1e8'; ctx.lineWidth = TW + 26; ctx.stroke(trackPath);
    ctx.setLineDash([44, 44]); ctx.strokeStyle = '#e8453c'; ctx.stroke(trackPath);
    ctx.setLineDash([]); ctx.strokeStyle = '#5c5f73'; ctx.lineWidth = TW; ctx.stroke(trackPath);
    ctx.setLineDash([36, 44]); ctx.strokeStyle = 'rgba(255,246,214,.7)'; ctx.lineWidth = 7; ctx.stroke(trackPath);
    ctx.setLineDash([]);

    // chequered start line across the track at sample 0
    var a0 = Math.atan2(track[1].y - track[0].y, track[1].x - track[0].x), n = 8, sq = TW / n;
    ctx.save(); ctx.translate(track[0].x, track[0].y); ctx.rotate(a0);
    for (i = 0; i < n; i++) for (var r = 0; r < 2; r++) { ctx.fillStyle = (i + r) % 2 ? '#2b2350' : '#ffffff'; ctx.fillRect(r * sq - sq, -TW / 2 + i * sq, sq + 0.5, sq + 0.5); }
    ctx.restore();

    ctx.strokeStyle = 'rgba(30,25,50,.35)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath();
    for (i = 2; i < skids.length; i++) {
      var a = skids[i - 2], b = skids[i];
      if (Math.hypot(a.x - b.x, a.y - b.y) < 60) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
    }
    ctx.stroke();

    drawCar();

    for (i = 0; i < trees.length; i++) {
      var t = trees[i];
      if (Math.abs(t.x - car.x) > R || Math.abs(t.y - car.y) > R) continue;
      ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.beginPath(); ctx.arc(t.x + 8, t.y + 10, t.r, 0, 7); ctx.fill();
      ctx.fillStyle = t.shade < 0.5 ? '#3da35d' : '#2f9150'; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 7); ctx.fill();
      ctx.fillStyle = t.shade < 0.5 ? '#56bf73' : '#44a866'; ctx.beginPath(); ctx.arc(t.x - t.r * 0.25, t.y - t.r * 0.25, t.r * 0.5, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawControls() {
    var w = ui.wheel, r = w.r, i;
    // steering wheel
    ctx.save(); ctx.translate(w.x, w.y);
    ctx.fillStyle = 'rgba(255,250,240,.35)'; ctx.beginPath(); ctx.arc(0, 0, r + 8, 0, 7); ctx.fill();
    ctx.rotate(wheelAngle);
    ctx.strokeStyle = '#2b2350'; ctx.lineCap = 'round';
    ctx.lineWidth = r * 0.16;
    for (i = 0; i < 3; i++) { var a = Math.PI / 2 + i * Math.PI * 2 / 3 + (i ? (i === 1 ? 0.5 : -0.5) : 0); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86); ctx.stroke(); }
    ctx.lineWidth = r * 0.2; ctx.beginPath(); ctx.arc(0, 0, r * 0.88, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#e8453c'; ctx.lineWidth = r * 0.2; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, -Math.PI / 2 - 0.14, -Math.PI / 2 + 0.14); ctx.stroke();   // top-centre marker
    ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#2b2350'; ctx.lineWidth = r * 0.05; ctx.stroke();
    ctx.restore();
    // horn glyph on the hub (does not rotate)
    ctx.fillStyle = '#2b2350';
    ctx.beginPath(); ctx.arc(w.x - r * 0.12, w.y, r * 0.07, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w.x - r * 0.08, w.y - r * 0.035); ctx.lineTo(w.x + r * 0.13, w.y - r * 0.13); ctx.lineTo(w.x + r * 0.13, w.y + r * 0.13); ctx.lineTo(w.x - r * 0.08, w.y + r * 0.035); ctx.closePath(); ctx.fill();

    // pedals
    [[ui.brake, '#e8453c', '#b02f28', 'BRAKE', braking], [ui.accel, '#2fb463', '#1d8a48', 'GO', throttle]].forEach(function (p) {
      var b = p[0], down = p[4] * 5;
      ctx.fillStyle = p[2]; rr(b.x, b.y + 6, b.w, b.h, 16); ctx.fill();
      ctx.fillStyle = p[1]; rr(b.x, b.y + down, b.w, b.h, 16); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      for (var g = 0; g < 3; g++) { rr(b.x + b.w * 0.18, b.y + down + b.h * (0.14 + g * 0.13), b.w * 0.64, b.h * 0.05, 3); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 ' + Math.round(b.w * 0.22) + 'px ' + FONT;
      ctx.fillText(p[3], b.x + b.w / 2, b.y + down + b.h * 0.76);
    });
  }

  function drawHud() {
    // timing panel
    var k = clamp(Math.min(W, H) / 620, 0.72, 1.1), pw = 196 * k, ph = 92 * k;
    ctx.fillStyle = 'rgba(255,250,240,.93)'; rr(10, 10, pw, ph, 20 * k); ctx.fill();
    ctx.fillStyle = '#2b2350'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = '800 ' + Math.round(17 * k) + 'px ' + FONT; ctx.fillText('LAP ' + lap, 10 + 16 * k, 10 + 26 * k);
    ctx.font = '800 ' + Math.round(38 * k) + 'px ' + FONT; ctx.fillText(fmt(lapTime), 10 + 16 * k, 10 + 62 * k);
    ctx.font = '600 ' + Math.round(15 * k) + 'px ' + FONT;
    ctx.fillText('Best ' + (best === null ? '--' : fmt(best)) + (lastLap === null ? '' : '   Last ' + fmt(lastLap)), 10 + 16 * k, 10 + 82 * k);

    // map
    var mw = 132 * k, mh = 100 * k, mx = W - mw - 10, my = 66;
    ctx.fillStyle = 'rgba(43,35,80,.55)'; rr(mx, my, mw, mh, 14 * k); ctx.fill();
    var pad = 12 * k, sc = Math.min((mw - pad * 2) / (bbox.x1 - bbox.x0), (mh - pad * 2) / (bbox.y1 - bbox.y0));
    var ox = mx + (mw - (bbox.x1 - bbox.x0) * sc) / 2 - bbox.x0 * sc, oy = my + (mh - (bbox.y1 - bbox.y0) * sc) / 2 - bbox.y0 * sc;
    ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 4 * k; ctx.lineJoin = 'round'; ctx.setLineDash([]);
    ctx.beginPath();
    for (var i = 0; i < N; i += 3) ctx.lineTo(ox + track[i].x * sc, oy + track[i].y * sc);
    ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#2b2350'; ctx.fillRect(ox + track[0].x * sc - 5 * k, oy + track[0].y * sc - 1.5 * k, 10 * k, 3 * k);
    ctx.fillStyle = car.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ox + clamp(car.x, bbox.x0 - 200, bbox.x1 + 200) * sc, oy + clamp(car.y, bbox.y0 - 200, bbox.y1 + 200) * sc, 5 * k, 0, 7); ctx.fill(); ctx.stroke();

    // speed
    var sw = 116 * k, sx = W / 2 - sw / 2, sy = H - 54 * k - 12;
    ctx.fillStyle = 'rgba(255,250,240,.93)'; rr(sx, sy, sw, 54 * k, 18 * k); ctx.fill();
    ctx.fillStyle = '#2b2350'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 ' + Math.round(30 * k) + 'px ' + FONT;
    ctx.fillText(Math.round(Math.abs(car.vf) * 0.13) + (car.vf < -5 ? ' R' : ''), W / 2 - 16 * k, sy + 29 * k);
    ctx.font = '600 ' + Math.round(14 * k) + 'px ' + FONT; ctx.fillText('mph', W / 2 + 30 * k, sy + 32 * k);

    // start lights
    if (state === 'count' || (state === 'race' && lap === 1 && lapTime < 0.9)) {
      var lit = state === 'race' ? 4 : 4 - Math.ceil(countdown), lr = 20 * k, lx = W / 2 - lr * 3.2, ly = H * 0.22;
      ctx.fillStyle = '#2b2350'; rr(lx - lr * 1.6, ly - lr * 1.6, lr * 9.6, lr * 3.2, lr * 1.2); ctx.fill();
      for (var j = 0; j < 3; j++) {
        ctx.fillStyle = lit === 4 ? '#3ddc6e' : (j < lit ? '#ff3b30' : '#55507a');
        ctx.beginPath(); ctx.arc(lx + j * lr * 3.2, ly, lr, 0, 7); ctx.fill();
      }
    }
    // toast
    if (toast.t > 0) {
      ctx.globalAlpha = Math.min(1, toast.t * 2.5);
      ctx.font = '800 ' + Math.round(22 * k) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      var tw = Math.min(W - 24, ctx.measureText(toast.text).width + 44 * k);
      ctx.fillStyle = toast.good ? '#2fb463' : '#2b2350'; rr(W / 2 - tw / 2, H * 0.3, tw, 48 * k, 24 * k); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(toast.text, W / 2, H * 0.3 + 25 * k, tw - 24);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#7cc96b'; ctx.fillRect(0, 0, W, H);
    drawWorld();
    if (state !== 'menu') { drawHud(); drawControls(); }
  }

  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function inRect(b, x, y) { return x > b.x - 14 && x < b.x + b.w + 14 && y > b.y - 14 && y < b.y + b.h + 20; }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (state === 'menu') return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var x = e.clientX, y = e.clientY, w = ui.wheel, d = Math.hypot(x - w.x, y - w.y), role = null;
    if (d < w.r * 0.32) { honk(); car.bounce = 1; }
    else if (d < w.r * 1.35) role = 'wheel';
    else if (inRect(ui.accel, x, y)) role = 'accel';
    else if (inRect(ui.brake, x, y)) role = 'brake';
    if (role) pointers[e.pointerId] = { role: role, ang: Math.atan2(y - w.y, x - w.x) };
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p || p.role !== 'wheel') return;
    var w = ui.wheel, dx = e.clientX - w.x, dy = e.clientY - w.y;
    if (Math.hypot(dx, dy) < w.r * 0.2) return;
    var ang = Math.atan2(dy, dx);
    wheelAngle = clamp(wheelAngle + wrap(ang - p.ang), -MAXW, MAXW);
    p.ang = ang;
  });
  function lift(e) { delete pointers[e.pointerId]; }
  canvas.addEventListener('pointerup', lift);
  canvas.addEventListener('pointercancel', lift);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (state !== 'menu' && (e.key === ' ' || e.key.indexOf('Arrow') === 0)) e.preventDefault();
    if (e.key === ' ' && state !== 'menu' && !e.repeat) { honk(); car.bounce = 1; }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  window.addEventListener('blur', function () { keys = {}; pointers = {}; });
  window.addEventListener('resize', layout);

  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () { muted = !muted; muteBtn.setAttribute('aria-pressed', String(muted)); });
  document.getElementById('reset').addEventListener('click', function () {
    if (state === 'menu') return;
    placeCar(nearest(car.x, car.y).i);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      car.color = b.getAttribute('data-c'); car.bounce = 1;
    });
  });
  document.getElementById('go').addEventListener('click', function () {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !ac) ac = new AC();
      if (ac && ac.state === 'suspended') ac.resume();
      startAudioLoops();
    } catch (err) { ac = null; eng = null; }
    startEl.hidden = true; state = 'count'; countdown = 3; lastBeep = 4;
  });

  buildWorld();
  layout();
  placeCar(3); lapProg = 3;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
