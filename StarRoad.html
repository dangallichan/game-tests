    [[-1, -0.3], [1, -0.3], [-1, 0.28], [1, 0.28]].forEach(function (p) { rr(p[0] * w * 0.5 - w * 0.09, p[1] * h - h * 0.1, w * 0.18, h * 0.2, w * 0.06); ctx.fill(); });
    ctx.fillStyle = car.color; rr(-w / 2, -h / 2, w, h, w * 0.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(-w * 0.12, -h / 2, w * 0.24, h, 2); ctx.fill();
    ctx.fillStyle = '#bfe6ff'; rr(-w * 0.36, -h * 0.26, w * 0.72, h * 0.2, w * 0.1); ctx.fill();
    ctx.fillStyle = '#9fd0ee'; rr(-w * 0.32, h * 0.2, w * 0.64, h * 0.12, w * 0.08); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.14)'; rr(-w * 0.36, -h * 0.04, w * 0.72, h * 0.22, w * 0.08); ctx.fill();
    ctx.fillStyle = '#fff3a8';
    ctx.beginPath(); ctx.arc(-w * 0.28, -h * 0.43, w * 0.09, 0, 7); ctx.arc(w * 0.28, -h * 0.43, w * 0.09, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff5a5a'; rr(-w * 0.38, h * 0.43, w * 0.2, h * 0.04, 2); ctx.fill(); rr(w * 0.18, h * 0.43, w * 0.2, h * 0.04, 2); ctx.fill();
    ctx.restore();
  }

  function drawHud() {
    var pop = 1 + hudPop * 0.25, r = 22;
    ctx.fillStyle = 'rgba(255,250,240,.94)'; rr(12, 12, 190, 84, 26); ctx.fill();
    drawStar(44, 42, r * pop, 0, '#ffc93c', '#e8a400');
    ctx.fillStyle = '#2b2350'; ctx.font = '800 38px "Baloo 2", "Arial Rounded MT Bold", sans-serif';
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillText(String(count), 76, 44);
    var got = clamp(count - (nextGoal - 10), 0, 10);
    for (var i = 0; i < 10; i++) {
      ctx.fillStyle = i < got ? '#ffc93c' : 'rgba(43,35,80,.16)';
      ctx.beginPath(); ctx.arc(30 + i * 17, 78, 6, 0, 7); ctx.fill();
    }
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var th = THEMES[themeIdx];
    ctx.fillStyle = mix(grassFrom.grass, th.grass, grassMix); ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = mix(grassFrom.stripe, th.stripe, grassMix);
    var band = H * 0.22, off = scroll % (band * 2);
    for (var y = -band * 2 + off; y < H; y += band * 2) { ctx.fillRect(0, y, W, band); }

    // road
    ctx.fillStyle = '#f4f1e8'; ctx.fillRect(road.x - 8, 0, road.w + 16, H);
    ctx.fillStyle = '#5c5f73'; ctx.fillRect(road.x, 0, road.w, H);
    var dash = H * 0.09, gap = H * 0.08, doff = scroll % (dash + gap);
    ctx.fillStyle = '#fff6d6';
    for (var d = -dash - gap + doff; d < H; d += dash + gap) { rr(W / 2 - 5, d, 10, dash, 5); ctx.fill(); }
    // candy-striped kerbs
    var kb = 34, koff = scroll % (kb * 2);
    ctx.fillStyle = '#e8453c';
    for (var ky = -kb * 2 + koff; ky < H; ky += kb * 2) { ctx.fillRect(road.x - 8, ky, 8, kb); ctx.fillRect(road.x + road.w, ky, 8, kb); }

    var i;
    for (i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.type === 'puddle') {
        ctx.fillStyle = '#8fd3ff'; ctx.beginPath(); ctx.ellipse(it.x, it.y, it.r * 1.1, it.r * 0.7, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#c9ecff'; ctx.beginPath(); ctx.ellipse(it.x - it.r * 0.3, it.y - it.r * 0.15, it.r * 0.35, it.r * 0.18, 0, 0, 7); ctx.fill();
      }
    }
    for (i = scenery.length - 1; i >= 0; i--) drawScenery(scenery[i]);
    for (i = 0; i < items.length; i++) {
      var s = items[i];
      if (s.type === 'puddle') continue;
      var pulse = 1 + Math.sin(s.spin * 2.5) * 0.08;
      ctx.fillStyle = 'rgba(255,220,90,.3)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.5 * pulse, 0, 7); ctx.fill();
      if (s.type === 'big') drawStar(s.x, s.y, s.r * 1.25 * pulse, s.spin, '#ff6f91', '#ffffff');
      drawStar(s.x, s.y, s.r * (s.type === 'big' ? 0.8 : 1) * pulse, Math.sin(s.spin) * 0.3, '#ffc93c', s.type === 'big' ? '#ffffff' : '#e8a400');
    }
    drawCar();

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = clamp(p.life * 1.6, 0, 1); ctx.fillStyle = p.color;
      if (p.confetti) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size / 2, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    if (celebrate > 0) {
      var t = 2.4 - celebrate, sIn = Math.min(1, t * 4), sOut = Math.min(1, celebrate * 3);
      var R = Math.min(W, H) * 0.2 * sIn * sOut * (1 + Math.sin(t * 9) * 0.05);
      drawStar(W / 2, H * 0.38, R, Math.sin(t * 3) * 0.2, '#ffc93c', '#ffffff');
      ctx.fillStyle = '#2b2350'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 ' + Math.round(R * 0.62) + 'px "Baloo 2", "Arial Rounded MT Bold", sans-serif';
      if (R > 10) ctx.fillText(String(nextGoal - 10), W / 2, H * 0.38 + R * 0.08);
    }
    if (playing) drawHud();
  }

  // ---------- loop ----------
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function steer(e) { car.target = e.clientX; e.preventDefault(); }
  canvas.addEventListener('pointerdown', steer);
  canvas.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse' && e.buttons === 0) return; steer(e); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (e.key === ' ' && playing) { doHonk(); e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  window.addEventListener('resize', resize);

  document.getElementById('horn').addEventListener('click', function () { doHonk(); });
  var muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
  });
  Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.swatch'), function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      car.color = b.getAttribute('data-c'); car.bounce = 1;
    });
  });
  document.getElementById('go').addEventListener('click', function () {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !ac) ac = new AC();
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (err) { ac = null; }
    startEl.hidden = true; playing = true; itemDist = H; car.bounce = 1;
    honk();
  });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
